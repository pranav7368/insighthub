server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API → backend (same origin, so no CORS). Passes /api/... through unchanged.
    location /api/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;   # allow file uploads (backend caps at 50 MB)
    }

    # SPA: serve index.html for client-side routes (e.g. /share/<token>).
    location / {
        try_files $uri /index.html;
    }
}
